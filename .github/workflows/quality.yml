name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"

jobs:
  php-lint:
    name: PHP lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: none

      - name: Lint PHP files
        run: find . -path ./node_modules -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

  regression:
    name: Regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: none

      - name: Run regression suite
        run: php tests/regression_test.php

  translations:
    name: Translation compatibility
    runs-on: ubuntu-latest
    strategy:
      matrix:
        wordpress: ['6.8', 'latest']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: wp-cli
      - name: Download WordPress translation reader
        run: wp core download --version=${{ matrix.wordpress }} --path="$RUNNER_TEMP/svv-wordpress" --skip-content
      - name: Check catalogs, overrides, locale switching and cache isolation
        run: php tests/i18n_test.php "$RUNNER_TEMP/svv-wordpress/wp-includes/l10n"

  asset-sync:
    name: Asset sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild assets
        run: npm run build:assets

      - name: Verify generated assets are committed
        run: git diff --exit-code -- assets/map.min.js assets/openlayers.js assets/openlayers.css assets/style.min.css

  release-check:
    name: Release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: none

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Run release checklist
        run: npm run check:release
